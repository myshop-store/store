<!doctype html><html dir="rtl" lang="he"><head><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>הזמנה מהחנות</title><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet"><style>body{margin:0;font-family:Heebo,Arial,sans-serif;background:#fff;color:#16201C} header{max-width:960px;box-sizing:border-box;margin:0 auto;padding:20px 16px 12px} h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px} header div{font-size:15px;color:#55615B} h2{margin:12px 0 4px;font-size:20px} main{max-width:960px;margin:0 auto;padding:4px 16px 16px} select,input{font:inherit;padding:10px;border:1px solid #CDD6D1;border-radius:10px;box-sizing:border-box;min-height:44px;background:#fff;color:inherit} #filter{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px} .chip{flex:none;min-height:44px;padding:0 16px;border:1px solid #CDD6D1;border-radius:22px;background:#fff;color:#16201C;font-size:15px} .chip.on{border-color:#0B7A53;background:#0B7A53;color:#fff;font-weight:700} .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px} @media(min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}} .card{display:flex;flex-direction:column;gap:4px;padding-bottom:8px;border-bottom:1px solid #E6EBE8} .card strong{margin-top:6px;font-size:17px} .card img,.ph{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#EEF2F0} .cat{font-size:14px;color:#55615B} .box{background:#fff;border:1px solid #E6EBE8;border-radius:12px;padding:16px;margin-top:16px;display:grid;gap:10px} button{font:inherit;padding:12px;border:0;border-radius:10px;background:#0B7A53;color:#fff;cursor:pointer} button:disabled{opacity:.4} .qty{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;border:1px solid #CDD6D1;border-radius:10px;margin-top:4px} .qty button{width:48px;height:44px;padding:0;font-size:24px;font-weight:700;background:none;color:#0B7A53} .qty button:last-child{color:#55615B} .link{background:none;color:#0B7A53;padding:8px 0;text-decoration:underline} .line{border:1px solid #E6EBE8;border-radius:12px;padding:12px;margin-top:8px;display:grid;grid-template-columns:1fr 140px;gap:8px;align-items:center} .line .qty{margin-top:0} .out{font-weight:700;color:#B42318;min-height:46px;display:flex;align-items:center;margin-top:4px} .price{font-size:18px;font-weight:800} #msg{font-weight:700;margin-bottom:8px} #notice,#closed,#dayLimit{border-radius:10px;padding:12px 14px;margin-bottom:12px;font-weight:500} #notice{background:#E7F5EF;color:#0A5A3E;white-space:pre-line} #closed,#dayLimit{background:#fde8e6;color:#b42318} #total{font-size:20px;font-weight:800;margin-top:12px} #bar{position:sticky;bottom:0;padding:12px 0 16px;background:#fff;border-top:1px solid #E6EBE8;margin-top:12px} #bar button{width:100%;min-height:52px;font-weight:700} #contact a{color:#0B7A53} #contactBtn{display:block;margin-top:2px;min-height:44px;padding:8px 0} .coord{display:flex;align-items:center;gap:10px;min-height:44px} .coord input{width:22px;height:22px;min-height:0} #age{display:none} body.locked header,body.locked main{display:none} body.locked #age{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:16px;box-sizing:border-box} .agebox{max-width:360px;width:100%;display:grid;gap:12px;text-align:center;border:1px solid #E6EBE8;border-radius:12px;padding:24px;box-sizing:border-box} .agebox h2{margin:0;font-size:22px} .agebox p{margin:0;color:#55615B} .agebox button{min-height:48px;font-weight:700} .agebox .ageNo{background:#fff;color:#16201C;border:1px solid #CDD6D1} #ageMsg{font-weight:700;color:#B42318} [hidden]{display:none!important}</style></head><body class="locked"><div id="age" role="dialog" aria-modal="true" aria-labelledby="ageQ"><div class="agebox"><h2 id="ageQ">האם אתה מעל גיל 18?</h2><p>הכניסה לאתר מותרת רק למי שמעל גיל 18.</p><div id="ageButtons" style="display:grid;gap:10px"><button type="button" id="ageYes">אני מעל גיל 18</button><button type="button" class="ageNo" id="ageNo">אני מתחת לגיל 18</button></div><div id="ageMsg" role="alert" hidden>מצטערים, הכניסה לאתר מותרת רק למי שמעל גיל 18.</div></div></div><header><h1 id="title"></h1><div>מזמינים באתר, משלמים ואוספים בחנות</div><div id="headerContact" hidden></div><button type="button" class="link" id="contactBtn" hidden>פרטי קשר</button></header><main><section class="box" id="contact" hidden></section><div id="notice" hidden></div><div id="closed" hidden>ההזמנות באתר סגורות כרגע</div><div id="msg" role="status"></div><section id="shop"><nav id="filter" aria-label="קטגוריות"></nav><div class="grid" id="grid">טוען...</div></section><section id="cartView" hidden><button type="button" class="link" id="back">חזרה למוצרים</button><h2>עגלת קניות</h2><div id="lines"></div><div id="total"></div><div id="dayLimit" hidden></div><form class="box" id="form"><input id="name" placeholder="שם מלא" required><input id="phone" placeholder="טלפון" type="tel" required><select id="day" aria-label="תאריך איסוף" required></select><select id="hour" aria-label="שעת איסוף" required></select><label class="coord"><input type="checkbox" id="coordinate">מבקש לתאם זמן איסוף מול החנות</label><button id="send">שליחת הזמנה</button></form></section><div id="bar" hidden><button type="button" id="goCart"></button></div></main><script>var API="https://script.google.com/macros/s/AKfycbxAH-63jC6P3lD07K1paaY02Tup3nLWcZjXYarnU0T9OEEKzHkmw5_-otgPtkSTf1FB/exec";var google={script:{get run(){var ok=function(){},bad=function(){};var r=new Proxy({},{get:function(_,name){if(name==='withSuccessHandler')return function(f){ok=f;return r;};if(name==='withFailureHandler')return function(f){bad=f;return r;};return function(){var args=[].slice.call(arguments);fetch(API,{method:'POST',body:JSON.stringify({fn:name,args:args})}).then(function(x){return x.json();}).then(function(d){if(d.ok)ok(d.result);else bad(new Error(d.error));}).catch(function(){bad(new Error('אין חיבור לשרת. נסו שוב בעוד רגע.'));});};}});return r;}}};</script><script>var products=[],cart={},days=[],isOpen=false,category='';function byId(id){return document.getElementById(id);}var grid=byId('grid'),filter=byId('filter'),msg=byId('msg'),send=byId('send'),shop=byId('shop'),cartView=byId('cartView'),bar=byId('bar'),dayList=byId('day'),hourList=byId('hour'),coordinate=byId('coordinate');function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}function money(n){return '₪'+(Math.round(n*100)/100);}function total(){return products.reduce(function(s,p){return s+(cart[p.id]||0)*p.price;},0);}function count(){return Object.keys(cart).reduce(function(s,id){return s+cart[id];},0);}function change(p,d){var n=Math.min(p.available,Math.max(0,(cart[p.id]||0)+d));if(n)cart[p.id]=n;else delete cart[p.id];msg.textContent='';render();}function stepper(p){var w=el('div','qty');var plus=el('button','','+');plus.type='button';plus.disabled=(cart[p.id]||0)>=p.available;plus.setAttribute('aria-label','הוספת יחידה של '+p.name);plus.addEventListener('click',function(){change(p,1);});var minus=el('button','','−');minus.type='button';minus.disabled=!cart[p.id];minus.setAttribute('aria-label','הסרת יחידה של '+p.name);minus.addEventListener('click',function(){change(p,-1);});w.appendChild(plus);w.appendChild(el('span','',cart[p.id]||0));w.appendChild(minus);return w;}function draw(){grid.textContent='';products.filter(function(p){return !category||p.category===category;}).forEach(function(p){var c=el('div','card');var pic=el(p.image?'img':'div',p.image?'':'ph');if(p.image){pic.src=p.image;pic.alt=p.name;}c.appendChild(pic);c.appendChild(el('strong','',p.name));c.appendChild(el('div','cat',p.category));if(!p.price){c.appendChild(el('div','price','המחיר יעודכן בקרוב'));}else{c.appendChild(el('div','price',money(p.price)));if(!p.available)c.appendChild(el('div','out','אזל זמנית מהמלאי'));else if(isOpen)c.appendChild(stepper(p));}grid.appendChild(c);});}function drawCart(){var lines=byId('lines');lines.textContent='';products.filter(function(p){return cart[p.id];}).forEach(function(p){var l=el('div','line');var t=el('div');t.appendChild(el('strong','',p.name));t.appendChild(el('div','price',money(p.price*cart[p.id])));l.appendChild(t);l.appendChild(stepper(p));lines.appendChild(l);});if(!count())lines.appendChild(el('div','line','העגלה ריקה'));byId('total').textContent='סה״כ לתשלום בחנות: '+money(total());byId('form').hidden=!count();}function render(){draw();drawCart();byId('goCart').textContent='מעבר לעגלה: '+count()+' פריטים, '+money(total());bar.hidden=!count()||!cartView.hidden;}function show(inCart){shop.hidden=inCart;cartView.hidden=!inCart;render();window.scrollTo(0,0);}function fail(e){msg.textContent=e.message.replace(/^Error: /,'');send.disabled=false;}function fill(){var list=products.map(function(p){return p.category;}).filter(function(c,i,a){return a.indexOf(c)===i;});if(list.indexOf(category)<0)category='';filter.textContent='';[''].concat(list).forEach(function(c){var b=el('button',c===category?'chip on':'chip',c||'הכול');b.type='button';b.setAttribute('aria-pressed',c===category);b.addEventListener('click',function(){category=c;fill();draw();});filter.appendChild(b);});}function contactLink(text,href,sameTab){var a=el('a','',text);a.href=href;a.target=sameTab?'_top':'_blank';a.rel='noopener';return a;}function drawContact(d){var box=byId('contact'),head=byId('headerContact'),digits=d.phone.replace(/[^0-9]/g,''),rows=[];byId('title').textContent=d.title;document.title=d.title;if(d.phone){rows.push(['טלפון',contactLink(d.phone,'tel:'+digits,true)]);rows.push(['וואטסאפ',contactLink('שליחת הודעה','https://wa.me/972'+digits.replace(/^0/,''))]);}if(d.address)rows.push(['כתובת',contactLink(d.address,'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(d.address))]);if(d.email)rows.push(['אימייל',contactLink(d.email,'mailto:'+d.email,true)]);box.textContent='';rows.forEach(function(r){var l=el('div','',r[0]+': ');l.appendChild(r[1]);box.appendChild(l);});head.textContent=[d.phone,d.address].filter(Boolean).join(' | ');head.hidden=!head.textContent;byId('contactBtn').hidden=!rows.length;if(!rows.length)box.hidden=true;}function load(){google.script.run.withSuccessHandler(function(data){products=data.products;isOpen=data.open;drawContact(data);byId('notice').textContent=data.notice;byId('notice').hidden=!data.notice;byId('closed').textContent=data.closedText;byId('closed').hidden=isOpen;byId('dayLimit').textContent=data.limitMessage;byId('dayLimit').hidden=!isOpen||!data.dayFull;if(!isOpen){cart={};shop.hidden=false;cartView.hidden=true;}products.forEach(function(p){if(cart[p.id]>p.available)cart[p.id]=p.available;if(!cart[p.id])delete cart[p.id];});fill();render();}).withFailureHandler(fail).getCatalog();}function option(list,value,text){var o=el('option','',text);o.value=value;list.appendChild(o);}function fillHours(){var d=days.filter(function(x){return x.value===dayList.value;})[0];hourList.textContent='';option(hourList,'','שעת איסוף');(d?d.hours:[]).forEach(function(s){option(hourList,s,s);});}function syncPickup(){if(!days.length)coordinate.checked=true;var c=coordinate.checked;dayList.hidden=c;hourList.hidden=c;dayList.required=!c;hourList.required=!c;}option(dayList,'','תאריך איסוף');fillHours();function loadDays(){google.script.run.withSuccessHandler(function(list){days=list;days.forEach(function(d){option(dayList,d.value,d.label);});coordinate.disabled=!days.length;syncPickup();}).withFailureHandler(fail).getPickupDays();}dayList.addEventListener('change',fillHours);coordinate.addEventListener('change',syncPickup);byId('contactBtn').addEventListener('click',function(){byId('contact').hidden=!byId('contact').hidden;});byId('goCart').addEventListener('click',function(){show(true);});byId('back').addEventListener('click',function(){show(false);});byId('form').addEventListener('submit',function(e){e.preventDefault();var items=Object.keys(cart).map(function(id){return {id:id,qty:cart[id]};});var pickup=coordinate.checked?'בתיאום מול החנות':dayList.options[dayList.selectedIndex].textContent+' בשעות '+hourList.value;send.disabled=true;msg.textContent='שולח...';google.script.run.withSuccessHandler(function(r){cart={};e.target.reset();fillHours();syncPickup();send.disabled=false;show(false);msg.textContent='ההזמנה התקבלה. מספר הזמנה: '+r.number+'. לתשלום בחנות: '+money(r.total)+'. איסוף: '+pickup;load();}).withFailureHandler(function(err){fail(err);load();}).placeOrder({name:byId('name').value,phone:byId('phone').value,day:dayList.value,hour:hourList.value,coordinate:coordinate.checked,items:items});});function unlockAge(){document.body.classList.remove('locked');}try{if(sessionStorage.getItem('age18')==='1')unlockAge();}catch(err){}byId('ageYes').addEventListener('click',function(){try{sessionStorage.setItem('age18','1');}catch(err){}unlockAge();window.scrollTo(0,0);});byId('ageNo').addEventListener('click',function(){byId('ageButtons').hidden=true;byId('ageMsg').hidden=false;});load();loadDays();</script></body></html>
