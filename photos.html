<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>עריכת תמונת מוצר</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#16201C;--muted:#55615B;--line:#CDD6D1;--soft:#E6EBE8;--green:#0B7A53;--red:#B42318;--bg:#fff}
body{margin:0;font-family:Heebo,Arial,sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:16px}
h1{margin:4px 0 2px;font-size:22px;font-weight:800}
.sub{color:var(--muted);font-size:15px;margin-bottom:12px}
.box{border:1px solid var(--soft);border-radius:12px;padding:14px;margin-top:12px;display:grid;gap:10px}
button,.file{font:inherit;min-height:48px;padding:10px 14px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;text-align:center;display:flex;align-items:center;justify-content:center}
button.alt,.file.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
button:disabled{opacity:.4}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=password]{font:inherit;padding:10px;border:1px solid var(--line);border-radius:10px;min-height:44px;box-sizing:border-box;width:100%}
.file input{display:none}
.stage{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--soft);background:repeating-conic-gradient(#EEF2F0 0 25%,#fff 0 50%) 50%/20px 20px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.stage img,.stage canvas{max-width:100%;max-height:100%;display:block}
.empty{color:var(--muted);padding:20px;text-align:center}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw.on{outline:3px solid var(--green);outline-offset:2px}
.sw.pick{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw.pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
#msg{font-weight:700;min-height:24px}
#msg.err{color:var(--red)}
.note{font-size:14px;color:var(--muted)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>עריכת תמונת מוצר</h1>
  <div class="sub" id="product">טוען...</div>

  <section class="box" id="codeBox" hidden>
    <label for="code">קוד ניהול</label>
    <input id="code" type="password" autocomplete="current-password">
    <button type="button" id="codeOk">כניסה</button>
    <div class="note">הקוד נשמר בטלפון הזה, כך שלא צריך להקליד אותו שוב.</div>
  </section>

  <section id="editor" hidden>
    <div class="stage" id="stage"><div class="empty">אין תמונה למוצר. אפשר לצלם או לבחור תמונה.</div></div>
    <div class="row" style="margin-top:12px">
      <label class="file alt">צילום / בחירת תמונה<input type="file" id="file" accept="image/*"></label>
      <button type="button" id="remove">הסרת רקע</button>
    </div>
    <div class="box">
      <div>צבע רקע</div>
      <div class="swatches" id="swatches"></div>
    </div>
    <div id="msg" role="status" style="margin-top:12px"></div>
    <div class="row" style="margin-top:8px">
      <button type="button" class="alt" id="reset">ביטול שינויים</button>
      <button type="button" id="save" disabled>שמירה</button>
    </div>
    <p class="note">בפעם הראשונה הסרת הרקע מורידה מנוע של כ-40MB, ולכן כדאי להיות ב-Wi-Fi. אחר כך זה מהיר יותר.</p>
  </section>
</main>

<script type="module">
const API = 'https://script.google.com/macros/s/AKfycbxAH-63jC6P3lD07K1paaY02Tup3nLWcZjXYarnU0T9OEEKzHkmw5_-otgPtkSTf1FB/exec';
const LIB = 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';
const OUT = 1000;            // saved image size in px (square)
const PAD = 0.08;            // margin around the product
const COLORS = ['#ffffff', '#f3f4f6', '#000000', '#fdf6e3', '#e7f5ef', '#e8f0fe'];

const $ = id => document.getElementById(id);
const id = new URLSearchParams(location.search).get('id') || '';
let code = '';
try { code = localStorage.getItem('adminCode') || ''; } catch (e) {}
let original = null;   // HTMLImageElement of the current/new photo
let cutout = null;     // ImageBitmap of the product with transparent background
let color = '#ffffff';
let dirty = false;

function msg(text, err) { $('msg').textContent = text || ''; $('msg').className = err ? 'err' : ''; }

async function call(fn, arg) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ fn, args: [arg] }) });
  const d = await r.json();
  if (!d.ok) throw new Error(d.error);
  return d.result;
}

function loadImage(src) {
  return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; });
}

function show(node) { const s = $('stage'); s.textContent = ''; s.appendChild(node); }

// Crops to the product, centres it on a square of the chosen colour.
function compose() {
  const src = cutout || original;
  if (!src) return null;
  const w = src.width, h = src.height;
  let x0 = 0, y0 = 0, x1 = w, y1 = h;
  if (cutout) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.drawImage(cutout, 0, 0);
    const a = g.getImageData(0, 0, w, h).data;
    x0 = w; y0 = h; x1 = 0; y1 = 0;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (a[(y * w + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 <= x0 || y1 <= y0) { x0 = 0; y0 = 0; x1 = w; y1 = h; }
  }
  const bw = x1 - x0, bh = y1 - y0;
  const out = document.createElement('canvas'); out.width = OUT; out.height = OUT;
  const g = out.getContext('2d');
  g.fillStyle = color; g.fillRect(0, 0, OUT, OUT);
  const inner = cutout ? OUT * (1 - PAD * 2) : OUT;
  const k = cutout ? inner / Math.max(bw, bh) : Math.max(OUT / bw, OUT / bh);
  const dw = bw * k, dh = bh * k;
  g.imageSmoothingQuality = 'high';
  g.drawImage(src, x0, y0, bw, bh, (OUT - dw) / 2, (OUT - dh) / 2, dw, dh);
  return out;
}

function redraw() { const c = compose(); if (c) show(c); $('save').disabled = !dirty; }

function drawSwatches() {
  const box = $('swatches'); box.textContent = '';
  COLORS.forEach(c => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw' + (c === color ? ' on' : ''); b.style.background = c;
    b.setAttribute('aria-label', 'צבע רקע ' + c);
    b.addEventListener('click', () => { color = c; if (cutout) dirty = true; drawSwatches(); redraw(); });
    box.appendChild(b);
  });
  const p = document.createElement('label');
  p.className = 'sw pick' + (COLORS.indexOf(color) < 0 ? ' on' : '');
  p.title = 'צבע אחר';
  const inp = document.createElement('input'); inp.type = 'color'; inp.value = color;
  inp.setAttribute('aria-label', 'בחירת צבע אחר');
  inp.addEventListener('input', () => { color = inp.value; if (cutout) dirty = true; redraw(); });
  inp.addEventListener('change', drawSwatches);
  p.appendChild(inp); box.appendChild(p);
}

async function start() {
  if (!id) { $('product').textContent = 'חסר מזהה מוצר. יש לפתוח את הדף מכפתור "עריכת תמונה" באפליקציה.'; return; }
  if (!code) { $('product').textContent = 'יש להזין קוד ניהול'; $('codeBox').hidden = false; return; }
  try {
    const p = await call('getProductImage', { code, id });
    $('codeBox').hidden = true; $('editor').hidden = false;
    $('product').textContent = p.name;
    if (p.data) { original = await loadImage('data:' + p.mime + ';base64,' + p.data); show(original.cloneNode()); }
    drawSwatches();
  } catch (e) {
    $('product').textContent = e.message;
    if (/קוד/.test(e.message)) { try { localStorage.removeItem('adminCode'); } catch (x) {} code = ''; $('codeBox').hidden = false; }
  }
}

$('codeOk').addEventListener('click', () => {
  code = $('code').value.trim(); if (!code) return;
  try { localStorage.setItem('adminCode', code); } catch (e) {}
  start();
});

$('file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  original = await loadImage(URL.createObjectURL(f));
  cutout = null; dirty = true; msg('');
  show(original.cloneNode()); $('save').disabled = false;
});

$('remove').addEventListener('click', async () => {
  if (!original) { msg('אין תמונה. קודם צלמו או בחרו תמונה.', true); return; }
  $('remove').disabled = true; msg('מסיר רקע... (בפעם הראשונה זה לוקח יותר זמן)');
  try {
    const { removeBackground } = await import(LIB);
    // Phone photos are large; 1600px is plenty for a 1000px result and much faster.
    const s = Math.min(1, 1600 / Math.max(original.naturalWidth, original.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(original.naturalWidth * s); c.height = Math.round(original.naturalHeight * s);
    c.getContext('2d').drawImage(original, 0, 0, c.width, c.height);
    const input = await new Promise(ok => c.toBlob(ok, 'image/png'));
    const blob = await removeBackground(input, {
      model: 'isnet_quint8',
      output: { format: 'image/png' },
      progress: (key, cur, total) => { if (total) msg('מוריד את מנוע הסרת הרקע... ' + Math.round(cur / total * 100) + '%'); }
    });
    cutout = await createImageBitmap(blob);
    dirty = true; msg('הרקע הוסר. אפשר לבחור צבע רקע ולשמור.');
    redraw();
  } catch (e) {
    msg('הסרת הרקע נכשלה: ' + e.message, true);
  }
  $('remove').disabled = false;
});

$('reset').addEventListener('click', () => { cutout = null; dirty = false; color = '#ffffff'; msg(''); start(); });

$('save').addEventListener('click', async () => {
  const c = compose(); if (!c) return;
  $('save').disabled = true; msg('שומר...');
  try {
    const data = c.toDataURL('image/jpeg', 0.9).split(',')[1];
    await call('saveProductImage', { code, id, data });
    dirty = false; msg('נשמר. התמונה תופיע באפליקציה אחרי סנכרון, ובאתר מיד.');
  } catch (e) {
    msg('השמירה נכשלה: ' + e.message, true); $('save').disabled = false;
  }
});

start();
</script>
</body>
</html>
